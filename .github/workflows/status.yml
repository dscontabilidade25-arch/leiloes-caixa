name: Organizar listas enviadas
on:
  push:
    paths: ["docs/**.csv", "docs/**.CSV"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Padronizar nomes, converter para UTF-8 e gerar status.json
        run: python3 organizar.py
      - name: Salvar
        run: |
          git config user.name "robo-leiloes"
          git config user.email "robo-leiloes@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "Status das listas atualizado"
          git push
