name: Atualizar listas da Caixa
on:
  schedule:
    - cron: "17 6 * * *"   # todo dia às 03:17 (horário da Bahia)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar listas
        run: bash baixar.sh
      - name: Salvar se mudou
        run: |
          git config user.name "robo-leiloes"
          git config user.email "robo-leiloes@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Listas da Caixa de $(date -u +%F)"
          git push
